<style>
/* Layout: one column, one question per screen, answers as thumb-sized buttons */
:root {
  --bg: #f3f5fa; --card: #ffffff; --ink: #18213a; --muted: #5d6680; --line: #dbe0ec;
  --accent: #1f3b8f; --accent-ink: #ffffff; --sun: #f2b705;
  --ok: #158a4a; --ok-bg: #e3f6ea; --bad: #c62f2f; --bad-bg: #fbe6e6;
  --display: "Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --body: "Source Sans 3", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f1424; --card: #182038; --ink: #edf0f8; --muted: #a2abc4; --line: #2b3554;
  --accent: #8fa8ff; --accent-ink: #0f1424; --sun: #f5c534;
  --ok: #4fd18a; --ok-bg: #123524; --bad: #ff7b7b; --bad-bg: #3d1a1d; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0f1424; --card: #182038; --ink: #edf0f8; --muted: #a2abc4; --line: #2b3554;
  --accent: #8fa8ff; --accent-ink: #0f1424; --sun: #f5c534;
  --ok: #4fd18a; --ok-bg: #123524; --bad: #ff7b7b; --bad-bg: #3d1a1d; color-scheme: dark }
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 17px; line-height: 1.45; -webkit-tap-highlight-color: transparent; }
.wrap { max-width: 560px; margin: 0 auto; padding-inline: 16px; padding-block: 18px 40px; display: flex; flex-direction: column; gap: 18px; }
h1, h2 { font-family: var(--display); margin: 0; text-wrap: balance; letter-spacing: -0.01em; }
h1 { font-size: 2rem; font-weight: 800; line-height: 1.05; }
h1 .mark { display: inline-block; background: var(--sun); color: #18213a; padding: 0 .25em; border-radius: 6px; }
h2 { font-size: 1.25rem; font-weight: 700; }
p { margin: 0; }
.muted { color: var(--muted); }
.eyebrow { font-size: .78rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }
button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

.modes { display: grid; gap: 10px; }
.mode { text-align: left; background: var(--card); border: 1.5px solid var(--line); border-radius: 14px; padding: 14px 16px; display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; align-items: center; }
.mode strong { font-size: 1.05rem; }
.mode .sub { color: var(--muted); font-size: .92rem; grid-column: 1; }
.mode .go { grid-row: 1 / span 2; grid-column: 2; font-family: var(--display); font-weight: 800; color: var(--accent); font-size: 1.3rem; }
.mode.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.mode.primary .sub, .mode.primary .go { color: var(--accent-ink); opacity: .85; }
.mode[disabled] { opacity: .45; cursor: default; }
.stats { display: flex; gap: 10px; flex-wrap: wrap; }
.stat { flex: 1 1 0; min-width: 90px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
.stat b { display: block; font-family: var(--display); font-size: 1.5rem; font-variant-numeric: tabular-nums; }
.stat span { font-size: .85rem; color: var(--muted); }

.top { display: flex; align-items: center; gap: 12px; }
.back { font-weight: 700; color: var(--accent); padding: 8px 0; }
.count { margin-left: auto; font-variant-numeric: tabular-nums; color: var(--muted); font-weight: 600; }
.bar { height: 6px; background: var(--line); border-radius: 99px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .25s; }
.q { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 18px; display: flex; flex-direction: column; gap: 8px; }
.q h2 { font-size: 1.3rem; line-height: 1.25; }
.opts { display: grid; gap: 10px; }
.opt { display: flex; gap: 12px; align-items: flex-start; text-align: left; width: 100%; min-height: 58px; padding: 14px 16px; border-radius: 14px; background: var(--card); border: 2px solid var(--line); font-size: 1.05rem; transition: background .15s, border-color .15s; }
.opt .k { flex: none; width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: .9rem; background: var(--bg); color: var(--muted); }
.opt span:last-child { min-width: 0; padding-top: 2px; }
.opt.ok { background: var(--ok-bg); border-color: var(--ok); }
.opt.ok .k { background: var(--ok); color: var(--card); }
.opt.bad { background: var(--bad-bg); border-color: var(--bad); }
.opt.bad .k { background: var(--bad); color: var(--card); }
.opt[disabled] { cursor: default; }
.verdict { font-weight: 700; font-size: 1.1rem; min-height: 1.5em; }
.verdict.ok { color: var(--ok); } .verdict.bad { color: var(--bad); }
.next { width: 100%; padding: 16px; border-radius: 14px; background: var(--accent); color: var(--accent-ink); font-weight: 700; font-size: 1.1rem; }

.score { font-family: var(--display); font-size: 3.4rem; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1; }
.pill { display: inline-block; padding: 4px 12px; border-radius: 99px; font-weight: 700; }
.pill.ok { background: var(--ok-bg); color: var(--ok); } .pill.bad { background: var(--bad-bg); color: var(--bad); }
.review { display: grid; gap: 8px; }
.rv { background: var(--card); border: 1px solid var(--line); border-left: 4px solid var(--bad); border-radius: 10px; padding: 10px 12px; font-size: .95rem; }
.rv .a { color: var(--ok); font-weight: 600; }
.btns { display: grid; gap: 10px; }
.ghost { width: 100%; padding: 14px; border-radius: 14px; border: 2px solid var(--line); font-weight: 700; }
.reset { color: var(--muted); font-size: .9rem; text-decoration: underline; justify-self: center; padding: 8px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

</head>

    <div class="modes">
      <button class="mode primary" data-m="examen"><strong>Simulacro de examen</strong><span class="sub">25 preguntas como el real · apto con 15</span><span class="go">→</span></button>
      <button class="mode" data-m="falladas" ${nf ? '' : 'disabled'}><strong>Repasar mis fallos</strong><span class="sub">${nf ? nf + ' preguntas que fallaste' : 'Aún no fallaste ninguna'}</span><span class="go">→</span></button>
      <button class="mode" data-m="todas"><strong>Las 300 al azar</strong><span class="sub">Todas las preguntas mezcladas</span><span class="go">→</span></button>
    </div>
    <p class="eyebrow">Practicar por tarea</p>
    <div class="modes">
      ${[1,2,3,4,5].map(t => `<button class="mode" data-m="t${t}"><strong>Tarea ${t}</strong><span class="sub">${TAREAS[t]} · ${Q.filter(q => q.t === t).length} preguntas</span><span class="go">→</span></button>`).join('')}
    </div>
    <button class="reset" id="reset">Borrar mi progreso</button>`;
  app.querySelectorAll('[data-m]').forEach(b => b.onclick = () => start(b.dataset.m));
  document.getElementById('reset').onclick = confirmReset;
  window.scrollTo(0, 0);
}

function confirmReset() {
  const b = document.getElementById('reset');
  if (b.dataset.sure) { mem = { falladas: [], vistas: [], simulacros: 0, aprobados: 0 }; save(); home(); return; }
  b.dataset.sure = '1'; b.textContent = 'Toca otra vez para confirmar';
}

function start(m) {
  let list;
  if (m === 'examen') list = [1,2,3,4,5].flatMap(t => shuffle(Q.filter(q => q.t === t)).slice(0, EXAMEN[t]));
  else if (m === 'falladas') list = shuffle(Q.filter(q => mem.falladas.includes(q.id)));
  else if (m === 'todas') list = shuffle(Q);
  else list = shuffle(Q.filter(q => q.t === +m.slice(1)));
  ses = { m, list, i: 0, ok: 0, errores: [] };
  ask();
}

function ask() {
  const q = ses.list[ses.i], n = ses.list.length;
  const tag = ses.m === 'examen' ? 'Simulacro' : ses.m === 'falladas' ? 'Repaso' : 'Tarea ' + q.t;
  app.innerHTML = `
    <div class="top"><button class="back" id="salir">← Salir</button><span class="count">${ses.i + 1} / ${n}</span></div>
    <div class="bar"><i style="width:${ses.i / n * 100}%"></i></div>
    <div class="q"><p class="eyebrow">${tag} · Pregunta ${q.id}</p><h2>${esc(q.q)}</h2></div>
    <div class="opts">${q.o.map((o, k) => `<button class="opt" data-k="${k}"><span class="k">${'abc'[k]}</span><span>${esc(o)}</span></button>`).join('')}</div>
    <p class="verdict" id="verdict" aria-live="polite"></p>
    <div id="after"></div>`;
  document.getElementById('salir').onclick = () => (ses.i > 0 ? results(true) : home());
  app.querySelectorAll('.opt').forEach(b => b.onclick = () => answer(+b.dataset.k));
  window.scrollTo(0, 0);
}

function answer(k) {
  const q = ses.list[ses.i], ok = k === q.r;
  const btns = app.querySelectorAll('.opt');
  btns.forEach(b => b.disabled = true);
  btns[q.r].classList.add('ok');
  if (!ok) btns[k].classList.add('bad');
  const v = document.getElementById('verdict');
  v.className = 'verdict ' + (ok ? 'ok' : 'bad');
  v.textContent = ok ? '¡Correcto!' : 'Incorrecto. La respuesta es la ' + 'abc'[q.r] + '.';
  if (!mem.vistas.includes(q.id)) mem.vistas.push(q.id);
  if (ok) { ses.ok++; if (ses.m === 'falladas') mem.falladas = mem.falladas.filter(id => id !== q.id); }
  else { ses.errores.push(q); if (!mem.falladas.includes(q.id)) mem.falladas.push(q.id); }
  save();
  const last = ses.i === ses.list.length - 1;
  document.getElementById('after').innerHTML = `<button class="next" id="next">${last ? 'Ver resultado' : 'Siguiente →'}</button>`;
  const nx = document.getElementById('next');
  nx.onclick = () => { if (last) results(false); else { ses.i++; ask(); } };
  nx.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
}

function results(early) {
  const hechas = early ? ses.i + (app.querySelector('.opt[disabled]') ? 1 : 0) : ses.list.length;
  const exam = ses.m === 'examen' && !early;
  const apto = ses.ok >= 15;
  if (exam) { mem.simulacros++; if (apto) mem.aprobados++; save(); }
  app.innerHTML = `
    <p class="eyebrow">${exam ? 'Resultado del simulacro' : 'Resultado'}</p>
    <div style="display:flex;align-items:baseline;gap:12px;flex-wrap:wrap">
      <span class="score">${ses.ok}/${hechas}</span>
      ${exam ? `<span class="pill ${apto ? 'ok' : 'bad'}">${apto ? 'APTO' : 'NO APTO'}</span>` : ''}
    </div>
    <p class="muted">${exam ? (apto ? 'Superaste el mínimo de 15 respuestas correctas.' : 'Hacen falta 15 correctas para ser apto. ¡A repasar!') : 'Respuestas correctas.'}</p>
    <div class="btns">
      <button class="next" id="otra">${ses.m === 'examen' ? 'Otro simulacro' : 'Practicar otra vez'}</button>
      <button class="ghost" id="inicio">Volver al inicio</button>
    </div>
    ${ses.errores.length ? `<h2>Para repasar</h2><div class="review">${ses.errores.map(q => `<div class="rv"><p>${esc(q.q)}</p><p class="a">✓ ${esc(q.o[q.r])}</p></div>`).join('')}</div>` : ''}`;
  const m = ses.m;
  document.getElementById('otra').onclick = () => (m === 'falladas' && !mem.falladas.length ? home() : start(m));
  document.getElementById('inicio').onclick = home;
  window.scrollTo(0, 0);
}

home();
</script>

</body>
</html>
